<div class="page page--narrow">
  <header class="page-header">
    <div>
      <span class="page-header__eyebrow">Operations</span>
      <h1 id="customer-edit-title">Edit customer</h1>
      <p>Update the customer's personal details and status.</p>
    </div>
  </header>

  @if (errorMessage(); as message) {
    <div class="alert" role="alert">{{ message }}</div>
  }

  <form class="card card__body" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-labelledby="customer-edit-title">
    <div class="form-grid">
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" formControlName="firstName" autocomplete="off" />
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" formControlName="lastName" autocomplete="off" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="off" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field__error">Enter a valid email address.</small>
        }
      </div>
      <div class="field">
        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" type="tel" formControlName="phoneNumber" autocomplete="off" />
      </div>
      <div class="field">
        <label for="nationalId">National ID</label>
        <input id="nationalId" formControlName="nationalId" autocomplete="off" />
      </div>
      <div class="field">
        <label for="dateOfBirth">Date of birth</label>
        <input id="dateOfBirth" type="date" formControlName="dateOfBirth" />
      </div>
      <div class="field field--full">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a class="button button--secondary" routerLink="/customers">Cancel</a>
      <button type="submit" class="button" [disabled]="submitting() || loading()">
        <app-icon name="check" [size]="16" />{{ submitting() ? 'Saving…' : 'Save changes' }}
      </button>
    </div>
  </form>
</div>

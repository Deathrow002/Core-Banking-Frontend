<div class="page page--narrow">
  <header class="page-header">
    <div>
      <span class="page-header__eyebrow">Operations</span>
      <h1 id="account-edit-title">Edit account</h1>
      <p>This account belongs to customer <span class="mono">{{ customerId() }}</span>.</p>
    </div>
  </header>

  @if (errorMessage(); as message) {
    <div class="alert" role="alert">{{ message }}</div>
  }

  <form class="card card__body" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-labelledby="account-edit-title">
    <div class="form-grid">
      <div class="field">
        <label for="accountType">Account type</label>
        <select id="accountType" formControlName="accountType">
          @for (type of accountTypes(); track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label for="currency">Currency</label>
        <select id="currency" formControlName="currency">
          @for (currency of currencyTypes(); track currency) {
            <option [value]="currency">{{ currency }}</option>
          }
        </select>
      </div>
      <div class="field field--full">
        <label for="balance">Balance</label>
        <input id="balance" type="number" min="0" step="0.01" formControlName="balance" />
        @if (form.controls.balance.touched && form.controls.balance.invalid) {
          <small class="field__error">Enter a balance of 0 or more.</small>
        }
      </div>
    </div>

    <div class="form-actions">
      <a class="button button--secondary" routerLink="/accounts">Cancel</a>
      <button type="submit" class="button" [disabled]="submitting() || loading()">
        <app-icon name="check" [size]="16" />{{ submitting() ? 'Saving…' : 'Save changes' }}
      </button>
    </div>
  </form>
</div>
